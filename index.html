<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FigmaToWeb</title>
</head>
<body>
    <div class="page-wrapper">
        <main class="form-card">
            <form class="proffy-form">
                <section class="section">
                    <h1>Seus dados</h1>
                    <div class="input-block">
                        <label for="name">Nome completo</label>
                        <input id="name" type="text" placeholder="" />
                    </div>
                    <div class="input-block">
                        <label for="avatar">Link da sua foto <span>(comece com //http)</span></label>
                        <input id="avatar" type="text" placeholder="" />
                    </div>
                    <div class="input-block">
                        <label for="whatsapp">Whatsapp <span>(somente números)</span></label>
                        <input id="whatsapp" type="text" placeholder="" />
                    </div>
                    <div class="input-block">
                        <label for="bio">Biografia</label>
                        <textarea id="bio" rows="5" placeholder=""></textarea>
                    </div>
                </section>

                <section class="section">
                    <h2>Sobre a aula</h2>
                    <div class="input-block">
                        <label for="subject">Matéria</label>
                        <select id="subject">
                            <option value="" disabled selected>Selecione qual você quer ensinar</option>
                        </select>
                    </div>
                    <div class="input-block">
                        <label for="cost">Custo da sua hora por aula <span>(em R$)</span></label>
                        <input id="cost" type="text" placeholder="" />
                    </div>
                </section>

                <section class="section">
                    <div class="section-head">
                        <h2>Horários disponíveis</h2>
                        <button type="button" class="button-link">+ Novo horário</button>
                    </div>
                    <div class="schedule-row">
                        <div class="input-block half">
                            <label for="weekday">Dia da semana</label>
                            <select id="weekday">
                                <option value="" disabled selected>Selecione o dia</option>
                            </select>
                        </div>
                        <div class="input-block small">
                            <label for="from">Das</label>
                            <input id="from" type="text" placeholder="" />
                        </div>
                        <div class="input-block small">
                            <label for="to">Até</label>
                            <input id="to" type="text" placeholder="" />
                        </div>
                    </div>
                </section>

                <footer class="form-footer">
                    <div class="footer-info">
                        <div class="icon-box" aria-hidden="true"></div>
                        <div>
                            <strong>Importante!</strong>
                            <span>Preencha todos os dados</span>
                        </div>
                    </div>
                    <button type="submit" class="button-primary">
                        <img src="assets/aula.svg" alt="Salvar" />
                        Salvar cadastro
                    </button>
                </footer>
            </form>
        </main>
    </div>
</body>
</html>
