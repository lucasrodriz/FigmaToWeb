<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>02 - Agendamento Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame" aria-label="02 - Agendamento Express">
      <header class="top-bar">
        <button class="icon-button" type="button" aria-label="Voltar">←</button>
        <h1>DogWalker</h1>
        <div class="avatar-pill" aria-hidden="true"></div>
      </header>

      <section class="content-panel">
        <article class="hero-card">
          <p class="eyebrow">PASSEIO EXPRESS</p>
          <h2>Passeadores próximos agora</h2>
          <p class="lead">Profissionais disponíveis para iniciar em até 30 minutos na Asa Norte.</p>
        </article>

        <article class="map-card" aria-label="Mapa de passeadores">
          <img class="map-bg" src="assets/map-bg.png" alt="Mapa de localização">
          <span class="pin pin-a"></span>
          <span class="pin pin-b"></span>
          <span class="pin pin-c"></span>
          <button class="mini-chip" type="button" aria-label="Mostrar mapa">↗</button>
        </article>

        <section class="results-card">
          <div class="section-heading">
            <h3>3 PASSEADORES ATIVOS</h3>
            <a href="#" class="text-link">Ver todos no mapa</a>
          </div>

          <article class="walker-card">
            <span class="avatar-badge"></span>
            <div class="walker-copy"></div>
          </article>
          <article class="walker-card">
            <span class="avatar-badge"></span>
            <div class="walker-copy"></div>
          </article>
          <article class="walker-card">
            <span class="avatar-badge"></span>
            <div class="walker-copy"></div>
          </article>
        </section>

        <button class="cta-button" type="button">SOLICITAR PASSEIO AGORA</button>
      </section>

      <nav class="bottom-nav" aria-label="Navegação principal">
        <a class="nav-link" href="#">Explorar</a>
        <a class="nav-link active" href="#">Express</a>
        <a class="nav-link" href="#">Mensagens</a>
        <a class="nav-link" href="#">Perfil</a>
      </nav>
    </section>
  </main>
</body>
</html>
